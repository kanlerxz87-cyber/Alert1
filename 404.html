<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — MLB Live PBP</title>
  <!-- GitHub Pages serves this file for unmatched paths at any depth, where
       a plain relative stylesheet/home link would break. Resolve both from
       this project's Pages root (/Alert1/) or the server root when run locally.
       This is the only upstream line changed for the new repository name. -->
  <script>
    (function () {
      var base = document.createElement('base');
      base.href = location.pathname.indexOf('/Alert1/') === 0 ? '/Alert1/' : '/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="game-main" style="text-align:center; padding-top:80px;">
    <div style="font-size:52px;">⚾</div>
    <h1>404 — Nothing at this base</h1>

    <p><a class="btn" href="index.html" style="color:#fff;">← Back to scoreboard</a></p>
  </main>
</body>
</html>
