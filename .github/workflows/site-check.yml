name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/restoration-check.mjs

  dom-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/run-all.mjs
      - run: node tests/props-provenance-test.mjs
      - run: node tests/alert1-feedlog-and-provenance-test.mjs
      - run: node tests/da098af9-upcoming-and-parity-test.mjs
      - run: node tests/live-capture-alerts-test.mjs
